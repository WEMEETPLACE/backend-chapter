<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNAKE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--panel:#0d0d14;--border:#1a1a2e;
  --accent:#39ff14;--accent-dim:#1a7a0a;
  --accent-glow:0 0 8px #39ff14,0 0 20px #39ff1466;
  --food:#ff1744;--amber:#ffab00;--cyan:#00e5ff;
}
html,body{width:100%;height:100%;background:var(--bg);font-family:'Silkscreen',monospace;color:#e0e0e0;overflow:hidden;display:flex;align-items:center;justify-content:center}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.08) 2px,rgba(0,0,0,.08) 4px);pointer-events:none;z-index:1000}
#wrapper{display:flex;flex-direction:column;align-items:center;gap:16px;position:relative}
#title-bar{font-family:'Press Start 2P',monospace;font-size:28px;letter-spacing:6px;color:var(--accent);text-shadow:var(--accent-glow);text-align:center;animation:flicker 4s infinite alternate}
@keyframes flicker{0%,93%,95%,97%,100%{opacity:1}94%{opacity:.7}96%{opacity:.85}}
#hud{display:flex;justify-content:space-between;width:100%;max-width:482px;padding:0 2px;font-size:11px;letter-spacing:1px}
.hud-item{color:#666}.hud-item span{color:var(--accent);text-shadow:0 0 6px var(--accent)}.hud-item.high span{color:var(--amber);text-shadow:0 0 6px #ffab0088}
#crt{position:relative;border:3px solid var(--border);border-radius:6px;background:var(--panel);padding:8px;box-shadow:inset 0 0 40px rgba(57,255,20,.03),0 0 30px rgba(57,255,20,.06);transition:box-shadow .4s}
#crt::before{content:'';position:absolute;inset:8px;border-radius:2px;box-shadow:inset 0 0 60px rgba(0,0,0,.6);pointer-events:none;z-index:2}
canvas{display:block;border-radius:2px;image-rendering:pixelated}
#controls{font-size:9px;color:#444;letter-spacing:1px;text-align:center;line-height:2.2}
#controls kbd{display:inline-block;background:#161622;border:1px solid #2a2a3e;border-radius:3px;padding:2px 6px;font-family:'Silkscreen',monospace;font-size:8px;color:#888;margin:0 1px}
.overlay{position:absolute;inset:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,6,12,.9);border-radius:2px;z-index:10;opacity:0;transition:opacity .3s;pointer-events:none}
.overlay.visible{opacity:1;pointer-events:auto}
.overlay h2{font-family:'Press Start 2P',monospace;font-size:18px;margin-bottom:16px;letter-spacing:3px}
#start-screen h2{color:var(--accent);text-shadow:var(--accent-glow)}
#gameover-screen h2{color:var(--food);text-shadow:0 0 12px rgba(255,23,68,.4)}
.overlay .sub{font-size:10px;color:#777;margin-bottom:6px;letter-spacing:1px}
.overlay .score-display{font-family:'Press Start 2P',monospace;font-size:32px;color:var(--amber);text-shadow:0 0 12px #ffab0066;margin:8px 0 20px}
.overlay .new-record{font-size:10px;color:var(--cyan);text-shadow:0 0 8px #00e5ff66;margin-top:-14px;margin-bottom:16px;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.overlay .prompt{font-size:10px;color:var(--accent);letter-spacing:2px;animation:pulse 1.5s infinite;margin-top:12px}
#menu{display:flex;flex-direction:column;gap:4px;margin:4px 0 8px}
.menu-item{font-family:'Press Start 2P',monospace;font-size:11px;color:#444;padding:10px 20px;cursor:pointer;transition:color .15s;border-radius:4px;white-space:nowrap}
.menu-item.active{color:var(--accent);text-shadow:0 0 8px var(--accent)}
.menu-item .arrow{display:inline-block;width:18px;font-size:10px}
.menu-desc{font-family:'Silkscreen',monospace;font-size:9px;color:#333;margin-top:3px;padding-left:18px}
.menu-item.active .menu-desc{color:#666}

#touch-controls{display:none;gap:4px;margin-top:8px}
#touch-controls button{width:52px;height:52px;background:#111119;border:1px solid var(--border);border-radius:6px;color:#666;font-size:20px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
#touch-controls button:active{background:#1a1a2e;color:var(--accent);border-color:var(--accent-dim)}
@media(hover:none)and(pointer:coarse){#touch-controls{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);justify-content:center}#controls{display:none}}
@media(max-width:540px){#title-bar{font-size:20px;letter-spacing:4px}#hud{font-size:9px}#crt{padding:4px;border-width:2px}}
</style>
</head>
<body>
<div id="wrapper">
  <div id="title-bar">SNAKE</div>
  <div id="hud">
    <div class="hud-item">SCORE <span id="score-val">0</span></div>
    <div class="hud-item">SPEED <span id="speed-val">1</span></div>
    <div class="hud-item high">BEST <span id="high-val">0</span></div>
  </div>
  <div id="crt">
    <canvas id="c"></canvas>
    <div class="overlay visible" id="start-screen">
      <h2>SNAKE</h2>
      <div id="menu"></div>
      <div class="prompt">[↑↓] SELECT &nbsp; [ENTER] START</div>
    </div>
    <div class="overlay" id="gameover-screen">
      <h2>GAME OVER</h2>
      <div class="sub">SCORE</div>
      <div class="score-display" id="final-score">0</div>
      <div class="new-record" id="new-record" style="display:none">★ NEW RECORD ★</div>
      <div class="prompt">PRESS ANY KEY TO RETRY</div>
    </div>
  </div>
  <div id="controls">
    <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> MOVE &nbsp;
    <kbd>P</kbd> PAUSE &nbsp;
    <kbd>M</kbd> MUTE &nbsp;
    <kbd>H</kbd> HACK &nbsp;
    <kbd>T</kbd> THEME &nbsp;
    <kbd>-</kbd><kbd>+</kbd> SPEED
  </div>
  <div id="touch-controls">
    <div></div><button data-dir="up">▲</button><div></div>
    <button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
  </div>
</div>

<script>
// ════════════════════════════════════════
// CONSTANTS
// ════════════════════════════════════════
const CANVAS_SIZE = 481;
const DIRS = [{x:0,y:-1},{x:0,y:1},{x:-1,y:0},{x:1,y:0}];
const EXPAND_THRESHOLD = 0.5;
const MAX_GRID = 40;

// ════════════════════════════════════════
// MODES
// ════════════════════════════════════════
const MODES = [
  { id:'classic',  name:'CLASSIC',  desc:'기본 Snake 게임',        cols:24, rows:24, baseInterval:140 },
  { id:'fast',     name:'FAST',     desc:'2배속 스피드 모드',       cols:24, rows:24, baseInterval:70  },
  { id:'infinite', name:'INFINITE', desc:'맵이 무한으로 확장',      cols:10, rows:10, baseInterval:130 },
];

// ════════════════════════════════════════
// THEMES
// ════════════════════════════════════════
const THEMES = [
  { name:'NEON',   bg:'#0c0c14',grid:'#1a1a2e',eye:'#0c0c14',snakeH:'#39ff14',snakeB:'#2bcc0e',snakeT:'#1a7a0a',food:'#ff1744',particle:'#ffab00',accent:'#39ff14',accentDim:'#1a7a0a',cssBg:'#0a0a0f',cssPanel:'#0d0d14',cssBorder:'#1a1a2e' },
  { name:'OCEAN',  bg:'#060d18',grid:'#0e1a2e',eye:'#060d18',snakeH:'#00e5ff',snakeB:'#0097a7',snakeT:'#005662',food:'#ff6e40',particle:'#ffd740',accent:'#00e5ff',accentDim:'#005662',cssBg:'#040a14',cssPanel:'#060d18',cssBorder:'#0e1a2e' },
  { name:'SAKURA', bg:'#140a10',grid:'#2a1520',eye:'#140a10',snakeH:'#ff80ab',snakeB:'#f06292',snakeT:'#ad1457',food:'#76ff03',particle:'#e040fb',accent:'#ff80ab',accentDim:'#ad1457',cssBg:'#100810',cssPanel:'#140a10',cssBorder:'#2a1520' },
  { name:'AMBER',  bg:'#0f0c06',grid:'#1e1a0e',eye:'#0f0c06',snakeH:'#ffab00',snakeB:'#ff8f00',snakeT:'#a36200',food:'#00e676',particle:'#ff6d00',accent:'#ffab00',accentDim:'#a36200',cssBg:'#0c0a04',cssPanel:'#0f0c06',cssBorder:'#1e1a0e' },
  { name:'CYBER',  bg:'#0a0612',grid:'#1a1028',eye:'#0a0612',snakeH:'#d500f9',snakeB:'#aa00ff',snakeT:'#6200ea',food:'#00e5ff',particle:'#ffea00',accent:'#d500f9',accentDim:'#6200ea',cssBg:'#08040e',cssPanel:'#0a0612',cssBorder:'#1a1028' },
  { name:'MONO',   bg:'#0a0a0a',grid:'#1a1a1a',eye:'#0a0a0a',snakeH:'#ffffff',snakeB:'#b0b0b0',snakeT:'#606060',food:'#ff4444',particle:'#cccccc',accent:'#ffffff',accentDim:'#606060',cssBg:'#080808',cssPanel:'#0a0a0a',cssBorder:'#1a1a1a' },
];

let themeIndex = parseInt(localStorage.getItem('snake_theme')||'0',10) % THEMES.length;
let theme = THEMES[themeIndex];

function applyTheme() {
  theme = THEMES[themeIndex];
  const s = document.documentElement.style;
  s.setProperty('--bg',theme.cssBg); s.setProperty('--panel',theme.cssPanel);
  s.setProperty('--border',theme.cssBorder); s.setProperty('--accent',theme.accent);
  s.setProperty('--accent-dim',theme.accentDim);
  s.setProperty('--accent-glow',`0 0 8px ${theme.accent},0 0 20px ${theme.accent}66`);
  s.setProperty('--food',theme.food);
  localStorage.setItem('snake_theme',String(themeIndex));
}
applyTheme();

// ════════════════════════════════════════
// DYNAMIC GRID
// ════════════════════════════════════════
let cols, rows, cellSize, gridStep, offsetX, offsetY;

function setGrid(c, r) {
  cols = c; rows = r;
  cellSize = Math.floor((CANVAS_SIZE - 1) / Math.max(cols, rows)) - 1;
  gridStep = cellSize + 1;
  const usedW = cols * gridStep + 1;
  const usedH = rows * gridStep + 1;
  offsetX = Math.floor((CANVAS_SIZE - usedW) / 2);
  offsetY = Math.floor((CANVAS_SIZE - usedH) / 2);
}

function cellPos(c, r) {
  return { px: offsetX + c * gridStep + 1, py: offsetY + r * gridStep + 1 };
}

// ════════════════════════════════════════
// STATE
// ════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = CANVAS_SIZE; canvas.height = CANVAS_SIZE;

const $score=document.getElementById('score-val'), $speed=document.getElementById('speed-val');
const $high=document.getElementById('high-val'), $final=document.getElementById('final-score');
const $record=document.getElementById('new-record');
const $start=document.getElementById('start-screen'), $over=document.getElementById('gameover-screen');

let snake, dir, nextDir, food, score, speed, baseInterval, interval;
let highScore = parseInt(localStorage.getItem('snake_high')||'0',10);
let gameState = 'menu'; // menu | playing | paused | over
let gameMode = 'classic';
let menuIndex = 0;
let lastTick = 0;
let particles = [];
let muted = false;
let foodPulse = 0;
let autoPlay = false;
let manualSpeedOffset = 0;
let stage = 1;
let expandFlash = 0;

// AI visualization
let aiExplored = [];
let aiPath = [];
let aiTarget = 'food';

$high.textContent = highScore;

// ════════════════════════════════════════
// MENU
// ════════════════════════════════════════
function renderMenu() {
  document.getElementById('menu').innerHTML = MODES.map((m, i) =>
    `<div class="menu-item ${i===menuIndex?'active':''}" data-index="${i}">
      <span class="arrow">${i===menuIndex?'▸':''}</span>${m.name}
      <div class="menu-desc">${m.desc}</div>
    </div>`
  ).join('');
}
renderMenu();

document.getElementById('menu').addEventListener('click', e => {
  const item = e.target.closest('.menu-item');
  if (!item) return;
  menuIndex = parseInt(item.dataset.index);
  renderMenu();
  startGame();
});

// ════════════════════════════════════════
// AUDIO
// ════════════════════════════════════════
let audioCtx = null;
function ensureAudio() { if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }

function playTone(freq, dur, type='square', vol=0.1) {
  if(muted) return;
  try {
    ensureAudio();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,audioCtx.currentTime);
    g.gain.setValueAtTime(vol,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+dur);
  } catch(e){}
}
function sfxEat(){ playTone(520,.1); setTimeout(()=>playTone(780,.1),60); }
function sfxDie(){ playTone(200,.3,'sawtooth',.12); setTimeout(()=>playTone(120,.4,'sawtooth',.08),150); }
function sfxStart(){ playTone(440,.08); setTimeout(()=>playTone(660,.08),80); setTimeout(()=>playTone(880,.12),160); }
function sfxExpand(){ playTone(330,.1); setTimeout(()=>playTone(440,.1),80); setTimeout(()=>playTone(550,.1),160); setTimeout(()=>playTone(660,.15),240); }

// ════════════════════════════════════════
// PARTICLES
// ════════════════════════════════════════
function spawnParticles(x, y, color, count) {
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2, sp=1+Math.random()*2.5;
    const {px,py}=cellPos(x,y);
    particles.push({ x:px+cellSize/2, y:py+cellSize/2, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      life:1, decay:0.03+Math.random()*0.03, size:2+Math.random()*3, color });
  }
}
function updateParticles(){ for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.life-=p.decay; if(p.life<=0) particles.splice(i,1); }}
function drawParticles(){ for(const p of particles){ ctx.globalAlpha=p.life; ctx.fillStyle=p.color; ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size); } ctx.globalAlpha=1; }

// ════════════════════════════════════════
// GAME LOGIC
// ════════════════════════════════════════
function startGame() {
  gameMode = MODES[menuIndex].id;
  const mode = MODES[menuIndex];
  setGrid(mode.cols, mode.rows);
  baseInterval = mode.baseInterval;
  resetGame();
  sfxStart();
  gameState = 'playing';
  $start.classList.remove('visible');
}

function resetGame() {
  const cx = Math.floor(cols/2), cy = Math.floor(rows/2);
  snake = [{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  score = 0; speed = 1; manualSpeedOffset = 0; stage = 1;
  autoPlay = false; expandFlash = 0;
  aiExplored = []; aiPath = []; aiTarget = 'food';
  particles = [];
  recalcInterval(); placeFood(); updateHUD();
}

function recalcInterval() {
  const eff = Math.max(1, speed + manualSpeedOffset);
  interval = Math.max(20, baseInterval - (eff-1) * 8);
  $speed.textContent = eff;
}

function placeFood() {
  const occ = new Set(snake.map(s=>`${s.x},${s.y}`));
  if(occ.size >= cols*rows && gameMode==='infinite') { expandGrid(); }
  let pos, attempts=0;
  do { pos={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)}; attempts++; }
  while(occ.has(`${pos.x},${pos.y}`) && attempts<2000);
  food = pos;
}

function tick() {
  dir = {...nextDir};
  const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if(head.x<0||head.x>=cols||head.y<0||head.y>=rows){ die(); return; }
  for(const seg of snake) if(seg.x===head.x&&seg.y===head.y){ die(); return; }

  snake.unshift(head);

  if(head.x===food.x && head.y===food.y) {
    score++; sfxEat();
    spawnParticles(food.x, food.y, theme.particle, 8);
    spawnParticles(food.x, food.y, theme.food, 4);
    placeFood();
    if(score % 3 === 0){ speed++; recalcInterval(); }
    updateHUD();
    // infinite expansion check
    if(gameMode==='infinite' && snake.length >= cols*rows*EXPAND_THRESHOLD && cols<MAX_GRID) {
      expandGrid();
    }
  } else {
    snake.pop();
  }
}

function die() {
  gameState = 'over'; autoPlay = false; sfxDie();
  for(const seg of snake) spawnParticles(seg.x,seg.y,theme.snakeB,3);
  let isNew = false;
  if(score>highScore){ highScore=score; localStorage.setItem('snake_high',String(highScore)); $high.textContent=highScore; isNew=true; }
  $final.textContent = score;
  $record.style.display = isNew?'block':'none';
  $over.classList.add('visible');
}

function updateHUD() { $score.textContent=score; recalcInterval(); }

// ════════════════════════════════════════
// INFINITE MODE — EXPANSION
// ════════════════════════════════════════
function expandGrid() {
  const add = 4;
  const shift = Math.floor(add/2);
  for(const seg of snake){ seg.x+=shift; seg.y+=shift; }
  food.x+=shift; food.y+=shift;
  setGrid(cols+add, rows+add);
  stage++;
  expandFlash = 1.0;
  sfxExpand();
}

// ════════════════════════════════════════
// AI — IMPROVED AUTO-PLAY
// ════════════════════════════════════════
function bfsViz(sx, sy, tx, ty, obstacles) {
  const visited = new Map();
  const explored = [];
  const queue = [{x:sx,y:sy}];
  const sk = `${sx},${sy}`;
  visited.set(sk, null);
  let order = 0;

  while(queue.length) {
    const cur = queue.shift();
    const ck = `${cur.x},${cur.y}`;
    if(cur.x===tx && cur.y===ty) {
      // reconstruct path
      const pathCells=[], pathDirs=[];
      let k=ck;
      while(k!==sk) {
        const info=visited.get(k);
        const [px,py]=k.split(',').map(Number);
        pathCells.unshift({x:px,y:py});
        pathDirs.unshift(info.dir);
        k=info.parent;
      }
      return {path:pathDirs, cells:pathCells, explored, found:true};
    }
    for(const d of DIRS) {
      const nx=cur.x+d.x, ny=cur.y+d.y, nk=`${nx},${ny}`;
      if(nx<0||nx>=cols||ny<0||ny>=rows) continue;
      if(visited.has(nk)||obstacles.has(nk)) continue;
      visited.set(nk,{parent:ck,dir:d});
      explored.push({x:nx,y:ny,order:order++});
      queue.push({x:nx,y:ny});
    }
  }
  return {path:null, cells:[], explored, found:false};
}

function floodCount(sx, sy, obstacles) {
  const visited=new Set(); const queue=[{x:sx,y:sy}];
  visited.add(`${sx},${sy}`);
  while(queue.length){
    const cur=queue.shift();
    for(const d of DIRS){
      const nx=cur.x+d.x,ny=cur.y+d.y,k=`${nx},${ny}`;
      if(nx<0||nx>=cols||ny<0||ny>=rows) continue;
      if(visited.has(k)||obstacles.has(k)) continue;
      visited.add(k); queue.push({x:nx,y:ny});
    }
  }
  return visited.size;
}

function getAutoDir() {
  const head = snake[0];
  const tail = snake[snake.length-1];

  // obstacles = body except tail (tail moves away)
  const obs = new Set();
  for(let i=1;i<snake.length-1;i++) obs.add(`${snake[i].x},${snake[i].y}`);

  // 1) BFS to food
  const foodResult = bfsViz(head.x, head.y, food.x, food.y, obs);

  if(foodResult.found) {
    // Safety: from food position, can we reach tail? (with full body as obstacles, since eating = no pop)
    const safeObs = new Set();
    for(let i=0;i<snake.length;i++) safeObs.add(`${snake[i].x},${snake[i].y}`);
    safeObs.delete(`${food.x},${food.y}`); // head will be here
    // Also remove tail from obstacles for reachability check
    safeObs.delete(`${tail.x},${tail.y}`);

    const safeCheck = bfsViz(food.x, food.y, tail.x, tail.y, safeObs);

    if(safeCheck.found) {
      aiExplored = foodResult.explored;
      aiPath = foodResult.cells;
      aiTarget = 'food';
      return foodResult.path[0];
    }
  }

  // 2) Chase tail
  const tailResult = bfsViz(head.x, head.y, tail.x, tail.y, obs);
  if(tailResult.found && tailResult.path.length > 0) {
    aiExplored = tailResult.explored;
    aiPath = tailResult.cells;
    aiTarget = 'tail';
    return tailResult.path[0];
  }

  // 3) Pick direction with most open space
  aiExplored = foodResult.explored.length ? foodResult.explored : tailResult.explored;
  aiPath = [];
  aiTarget = 'survive';

  let bestDir = null, bestCount = -1;
  for(const d of DIRS) {
    if(d.x===-dir.x && d.y===-dir.y) continue;
    const nx=head.x+d.x, ny=head.y+d.y;
    if(nx<0||nx>=cols||ny<0||ny>=rows) continue;
    if(obs.has(`${nx},${ny}`)) continue;
    const count = floodCount(nx, ny, obs);
    if(count>bestCount){ bestCount=count; bestDir=d; }
  }
  return bestDir || dir;
}

// ════════════════════════════════════════
// RENDERING
// ════════════════════════════════════════
function hexToRgb(h){ const v=parseInt(h.slice(1),16); return[(v>>16)&255,(v>>8)&255,v&255]; }

function draw() {
  // full bg
  ctx.fillStyle = theme.bg;
  ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

  // grid cells
  ctx.fillStyle = theme.grid;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const{px,py}=cellPos(c,r);
    ctx.fillRect(px,py,cellSize,cellSize);
  }

  if(gameState==='menu') return;

  // ── AI visualization ──
  if(autoPlay && gameState==='playing' && aiExplored.length) {
    const maxOrd = aiExplored.length;
    const vizColor = aiTarget==='food' ? theme.accent : (aiTarget==='tail' ? theme.food : '#ffab00');
    const [vr,vg,vb] = hexToRgb(vizColor);

    // explored cells — wave gradient
    for(const cell of aiExplored) {
      const alpha = 0.04 + 0.10 * (cell.order / maxOrd);
      ctx.fillStyle = `rgba(${vr},${vg},${vb},${alpha})`;
      const{px,py}=cellPos(cell.x,cell.y);
      ctx.fillRect(px,py,cellSize,cellSize);
    }

    // planned path
    if(aiPath.length) {
      for(let i=0;i<aiPath.length;i++) {
        const p=aiPath[i];
        const alpha = 0.15 + 0.25 * (1 - i/aiPath.length);
        ctx.fillStyle = `rgba(${vr},${vg},${vb},${alpha})`;
        const{px,py}=cellPos(p.x,p.y);
        ctx.beginPath();
        ctx.roundRect(px+2,py+2,cellSize-4,cellSize-4,Math.max(2,cellSize/6));
        ctx.fill();
      }
      // path line
      ctx.strokeStyle = `rgba(${vr},${vg},${vb},0.3)`;
      ctx.lineWidth = Math.max(1, cellSize/6);
      ctx.lineCap = 'round';
      ctx.beginPath();
      const h0 = cellPos(snake[0].x, snake[0].y);
      ctx.moveTo(h0.px+cellSize/2, h0.py+cellSize/2);
      for(const p of aiPath) {
        const{px,py}=cellPos(p.x,p.y);
        ctx.lineTo(px+cellSize/2,py+cellSize/2);
      }
      ctx.stroke();
    }
  }

  // ── food ──
  foodPulse += 0.06;
  const glow = 3 + Math.sin(foodPulse)*2;
  const{px:fx,py:fy}=cellPos(food.x,food.y);
  ctx.shadowColor=theme.food; ctx.shadowBlur=12+Math.sin(foodPulse)*4;
  ctx.fillStyle=theme.food;
  ctx.beginPath(); ctx.roundRect(fx-glow/2,fy-glow/2,cellSize+glow,cellSize+glow,Math.max(2,cellSize/5)); ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle=theme.food;
  ctx.beginPath(); ctx.roundRect(fx+2,fy+2,cellSize-4,cellSize-4,Math.max(2,cellSize/6)); ctx.fill();

  // ── snake ──
  const[hR,hG,hB]=hexToRgb(theme.snakeB);
  const[tR,tG,tB]=hexToRgb(theme.snakeT);

  for(let i=snake.length-1;i>=0;i--){
    const seg=snake[i];
    const{px,py}=cellPos(seg.x,seg.y);
    const t=i/Math.max(snake.length,1);

    if(i===0){
      ctx.shadowColor=theme.snakeH; ctx.shadowBlur=Math.min(10,cellSize/2);
      ctx.fillStyle=theme.snakeH;
      ctx.beginPath(); ctx.roundRect(px,py,cellSize,cellSize,Math.max(2,cellSize/5)); ctx.fill();
      ctx.shadowBlur=0;
      if(cellSize>=10){
        ctx.fillStyle=theme.eye;
        const es=Math.max(2,Math.round(cellSize/5));
        ctx.fillRect(px+cellSize*0.3-es/2,py+cellSize*0.35-es/2,es,es);
        ctx.fillRect(px+cellSize*0.7-es/2,py+cellSize*0.35-es/2,es,es);
      }
    } else {
      const cr=Math.round(hR+(tR-hR)*t), cg=Math.round(hG+(tG-hG)*t), cb=Math.round(hB+(tB-hB)*t);
      ctx.fillStyle=`rgb(${cr},${cg},${cb})`;
      ctx.beginPath(); ctx.roundRect(px+1,py+1,cellSize-2,cellSize-2,Math.max(1,cellSize/6)); ctx.fill();
    }
  }

  drawParticles();

  // ── HUD overlays on canvas ──
  ctx.font = `${Math.min(9,cellSize/2)}px "Press Start 2P",monospace`;
  ctx.textAlign = 'right';
  let ly = offsetY + 14;

  if(autoPlay && gameState==='playing'){
    const lbl = aiTarget==='food'?'AUTO▸FOOD': aiTarget==='tail'?'AUTO▸TAIL':'AUTO▸FLEE';
    const col = aiTarget==='food'?'#d500f9': aiTarget==='tail'?theme.food:'#ffab00';
    ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=6;
    ctx.fillText(lbl, offsetX+cols*gridStep-4, ly); ctx.shadowBlur=0; ly+=14;
  }

  if(manualSpeedOffset!==0){
    const col=manualSpeedOffset>0?'#ff6e40':'#00e5ff';
    ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=6;
    ctx.fillText(`SPD${manualSpeedOffset>0?'+':''}${manualSpeedOffset}`,offsetX+cols*gridStep-4,ly);
    ctx.shadowBlur=0; ly+=14;
  }

  // infinite mode: stage + progress
  if(gameMode==='infinite' && gameState!=='menu'){
    ctx.textAlign='left';
    ctx.fillStyle=theme.accent+'aa';
    ctx.fillText(`STAGE ${stage}`, offsetX+4, offsetY+14);
    // progress bar
    const ratio = Math.min(snake.length/(cols*rows*EXPAND_THRESHOLD),1);
    const bw=50, bh=4, bx=offsetX+4, by=offsetY+20;
    ctx.fillStyle='#333'; ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle=ratio>=1?'#ff6e40':theme.accent; ctx.fillRect(bx,by,bw*ratio,bh);
  }

  // theme name (bottom right)
  ctx.textAlign='right';
  ctx.fillStyle=theme.accent+'44';
  ctx.fillText(theme.name, offsetX+cols*gridStep-4, offsetY+rows*gridStep-4);
  ctx.textAlign='start';

  // expansion flash
  if(expandFlash>0){
    expandFlash-=0.025;
    const[ar,ag,ab]=hexToRgb(theme.accent);
    ctx.strokeStyle=`rgba(${ar},${ag},${ab},${expandFlash*0.6})`;
    ctx.shadowColor=theme.accent; ctx.shadowBlur=30*expandFlash;
    ctx.lineWidth=3;
    ctx.strokeRect(offsetX-2,offsetY-2,cols*gridStep+5,rows*gridStep+5);
    ctx.shadowBlur=0;

    if(expandFlash>0.5){
      ctx.font='14px "Press Start 2P",monospace'; ctx.textAlign='center';
      ctx.fillStyle=`rgba(${ar},${ag},${ab},${(expandFlash-0.5)*2})`;
      ctx.fillText(`STAGE ${stage}`, CANVAS_SIZE/2, CANVAS_SIZE/2);
      ctx.textAlign='start';
    }
  }

  // pause
  if(gameState==='paused'){
    ctx.fillStyle='rgba(6,6,12,0.7)'; ctx.fillRect(0,0,CANVAS_SIZE,CANVAS_SIZE);
    ctx.fillStyle=theme.accent; ctx.shadowColor=theme.accent; ctx.shadowBlur=10;
    ctx.font='18px "Press Start 2P",monospace'; ctx.textAlign='center';
    ctx.fillText('PAUSED',CANVAS_SIZE/2,CANVAS_SIZE/2);
    ctx.shadowBlur=0; ctx.textAlign='start';
  }
}

// ════════════════════════════════════════
// GAME LOOP
// ════════════════════════════════════════
function loop(time) {
  requestAnimationFrame(loop);
  updateParticles();
  if(gameState==='playing'){
    if(autoPlay) nextDir = getAutoDir();
    if(time-lastTick>=interval){ tick(); lastTick=time; }
  }
  draw();
}
requestAnimationFrame(loop);

// ════════════════════════════════════════
// INPUT
// ════════════════════════════════════════
const DIR_MAP = {
  ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},
  w:{x:0,y:-1},s:{x:0,y:1},a:{x:-1,y:0},d:{x:1,y:0},
};

document.addEventListener('keydown', e => {
  // ── menu ──
  if(gameState==='menu'){
    if(e.key==='ArrowUp'||e.key==='w'){ e.preventDefault(); menuIndex=(menuIndex-1+MODES.length)%MODES.length; renderMenu(); return; }
    if(e.key==='ArrowDown'||e.key==='s'){ e.preventDefault(); menuIndex=(menuIndex+1)%MODES.length; renderMenu(); return; }
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); startGame(); return; }
    return;
  }

  // ── game over ──
  if(gameState==='over'){
    e.preventDefault(); $over.classList.remove('visible');
    gameState='menu'; $start.classList.add('visible'); renderMenu();
    return;
  }

  // ── playing / paused ──
  if(e.key==='p'||e.key==='P'){ gameState=gameState==='paused'?'playing':'paused'; return; }
  if(e.key==='m'||e.key==='M'){ muted=!muted; return; }
  if(e.key==='h'||e.key==='H'){ autoPlay=!autoPlay; if(!autoPlay){aiExplored=[];aiPath=[];} return; }
  if(e.key==='t'||e.key==='T'){ themeIndex=(themeIndex+1)%THEMES.length; applyTheme(); return; }
  if(e.key==='='||e.key==='+'){ manualSpeedOffset++; recalcInterval(); return; }
  if(e.key==='-'||e.key==='_'){ manualSpeedOffset--; recalcInterval(); return; }

  const d=DIR_MAP[e.key];
  if(d&&gameState==='playing'){ e.preventDefault(); if(d.x!==-dir.x||d.y!==-dir.y) nextDir=d; }
});

// touch
document.querySelectorAll('#touch-controls button').forEach(btn=>{
  btn.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(gameState==='menu'){ startGame(); return; }
    if(gameState==='over'){ $over.classList.remove('visible'); gameState='menu'; $start.classList.add('visible'); renderMenu(); return; }
    const map={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
    const d=map[btn.dataset.dir];
    if(d&&gameState==='playing'&&(d.x!==-dir.x||d.y!==-dir.y)) nextDir=d;
  });
});

let touchStartX=0,touchStartY=0;
canvas.addEventListener('touchstart',e=>{
  if(gameState==='menu'){ e.preventDefault(); startGame(); return; }
  if(gameState==='over'){ e.preventDefault(); $over.classList.remove('visible'); gameState='menu'; $start.classList.add('visible'); renderMenu(); return; }
  touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY;
},{passive:false});
canvas.addEventListener('touchend',e=>{
  if(gameState!=='playing')return;
  const dx=e.changedTouches[0].clientX-touchStartX, dy=e.changedTouches[0].clientY-touchStartY;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
  const d=Math.abs(dx)>Math.abs(dy)?(dx>0?{x:1,y:0}:{x:-1,y:0}):(dy>0?{x:0,y:1}:{x:0,y:-1});
  if(d.x!==-dir.x||d.y!==-dir.y) nextDir=d;
});
</script>
